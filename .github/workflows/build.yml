name: Release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install NASM
        run: sudo apt update && sudo apt install -y nasm

      - name: Build
        run: make

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/floppy.img --clobber
          else
            gh release create "$TAG" build/floppy.img --title "$TAG" --generate-notes
          fi
